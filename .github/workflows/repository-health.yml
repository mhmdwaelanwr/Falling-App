name: Repository Health

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reject generated or sensitive tracked files
        shell: bash
        run: |
          bad="$(git ls-files | grep -E '(^|/)(\.gradle|\.kotlin|\.idea|build|DerivedData|xcuserdata|node_modules)/|(^|/)(local\.properties|\.env(\..*)?|google-services\.json|GoogleService-Info\.plist|Secrets\.xcconfig)$|\.(jks|keystore|p12|pfx|mobileprovision)$' || true)"
          if [ -n "$bad" ]; then
            echo "Unexpected generated/sensitive files are tracked:"
            echo "$bad"
            exit 1
          fi

      - name: Scan text sources for common secret patterns
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          roots = [Path('composeApp'), Path('iosApp'), Path('gradle'), Path('docs')]
          patterns = {
              'Google API key': re.compile(r'AIza[0-9A-Za-z_-]{30,}'),
              'GitHub token': re.compile(r'gh[pousr]_[A-Za-z0-9_]{20,}'),
              'OpenAI-style secret': re.compile(r'sk-[A-Za-z0-9_-]{20,}'),
              'Private key block': re.compile(r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----'),
          }

          findings = []
          for root in roots:
              if not root.exists():
                  continue
              for path in root.rglob('*'):
                  if not path.is_file():
                      continue
                  try:
                      text = path.read_text(encoding='utf-8')
                  except (UnicodeDecodeError, OSError):
                      continue
                  for label, pattern in patterns.items():
                      if pattern.search(text):
                          findings.append(f'{label}: {path}')

          if findings:
              raise SystemExit('Potential secrets detected:\n' + '\n'.join(findings))

          print('No common committed-secret patterns detected.')
          PY
